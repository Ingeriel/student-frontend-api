<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Attendance</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --ink: #1c2230;
      --muted: #5f6878;
      --line: #dadfe7;
      --accent: #2a4fd6;
      --accent-ink: #ffffff;
      --present: #1d7a4c;
      --late: #a86400;
      --absent: #b3321f;
      --error-bg: #fbeeea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --surface: #1a1f29;
        --ink: #e7ebf3;
        --muted: #98a1b3;
        --line: #2b3342;
        --accent: #7b9bff;
        --accent-ink: #0d1220;
        --present: #55c58a;
        --late: #e3a43c;
        --absent: #f0897a;
        --error-bg: #2b1916;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: -0.01em; }
    .lede { margin: 0 0 28px; color: var(--muted); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }

    form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 32px;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
    input, select {
      display: block;
      width: 100%;
      margin-bottom: 16px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }

    .status-line { margin: 12px 0 0; min-height: 1.4em; font-size: 0.9rem; color: var(--muted); }
    .status-line.error { color: var(--absent); }

    .summary { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 14px; font-size: 0.95rem; }
    .summary span { color: var(--muted); }
    .summary strong { color: var(--ink); font-size: 1.15rem; margin-right: 4px; }

    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .pill { font-weight: 600; }
    .pill.Present { color: var(--present); }
    .pill.Late { color: var(--late); }
    .pill.Absent { color: var(--absent); }

    .notice { padding: 12px 14px; border-radius: 6px; background: var(--error-bg); color: var(--absent); }
    .empty { padding: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lab Attendance</h1>
    <p class="lede">Record who was in the lab and review past entries.</p>

    <h2>Record attendance</h2>
    <form id="attendanceForm">
      <div class="grid">
        <div>
          <label for="studentName">Student name</label>
          <input type="text" id="studentName" maxlength="120" required>
        </div>
        <div>
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" maxlength="40">
        </div>
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status" required>
            <option value="Present">Present</option>
            <option value="Late">Late</option>
            <option value="Absent">Absent</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submitBtn">Save attendance</button>
      <p class="status-line" id="formStatus" role="status"></p>
    </form>

    <h2>Attendance records</h2>
    <div class="summary" id="summary" hidden></div>
    <div class="table-wrap" id="recordsContainer" aria-live="polite">
      <p class="empty">Loading records…</p>
    </div>
  </main>

  <script>
    // Your live backend on Vercel. Change it if your Vercel domain changes.
    const API_URL = 'https://student-api-backend-sooty.vercel.app/api';

    // Fields that exist in the database but are not useful to show
    const HIDDEN_FIELDS = ['_id', '__v', 'updatedAt'];

    const container = document.getElementById('recordsContainer');
    const summary = document.getElementById('summary');
    const form = document.getElementById('attendanceForm');
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');
    const dateInput = document.getElementById('date');

    function today() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }
    dateInput.value = today();

    // "studentName" -> "Student name"
    function labelFor(key) {
      const spaced = key.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ');
      return spaced.charAt(0).toUpperCase() + spaced.slice(1).toLowerCase();
    }

    function formatValue(key, value) {
      if (value === null || value === undefined) return '';
      if (key === 'createdAt') return new Date(value).toLocaleString();
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    }

    function showNotice(message) {
      container.textContent = '';
      summary.hidden = true;
      const div = document.createElement('div');
      div.className = 'notice';
      div.textContent = message;
      container.appendChild(div);
    }

    function renderSummary(records) {
      const counts = { Present: 0, Late: 0, Absent: 0 };
      records.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
      const hasStatus = Object.values(counts).some(n => n > 0);
      summary.textContent = '';
      if (!hasStatus) { summary.hidden = true; return; }
      Object.entries(counts).forEach(([name, n]) => {
        const wrap = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = n;
        const label = document.createElement('span');
        label.textContent = name;
        wrap.appendChild(strong);
        wrap.appendChild(label);
        summary.appendChild(wrap);
      });
      summary.hidden = false;
    }

    function renderTable(records) {
      container.textContent = '';

      if (records.length === 0) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No attendance records yet. Save the first one above.';
        container.appendChild(p);
        summary.hidden = true;
        return;
      }

      // Columns come from the data, so existing documents display whatever fields they have
      const columns = [];
      records.forEach(r => Object.keys(r).forEach(k => {
        if (!HIDDEN_FIELDS.includes(k) && !columns.includes(k)) columns.push(k);
      }));

      const table = document.createElement('table');
      const head = table.createTHead().insertRow();
      columns.forEach(key => {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = labelFor(key);
        head.appendChild(th);
      });

      const body = table.createTBody();
      records.forEach(record => {
        const row = body.insertRow();
        columns.forEach(key => {
          const cell = row.insertCell();
          const text = formatValue(key, record[key]);
          if (key === 'status' && ['Present', 'Late', 'Absent'].includes(text)) {
            const span = document.createElement('span');
            span.className = 'pill ' + text;
            span.textContent = text;
            cell.appendChild(span);
          } else {
            cell.textContent = text;
          }
        });
      });

      container.appendChild(table);
      renderSummary(records);
    }

    async function loadRecords() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        if (!response.ok) {
          showNotice('The server could not load records: ' + (data.error || response.status) + '. Check the Vercel logs and your MONGODB_URI.');
          return;
        }
        renderTable(data);
      } catch (error) {
        showNotice('Could not reach the API. Check that API_URL in index.html matches your Vercel domain.');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formStatus.className = 'status-line';
      formStatus.textContent = 'Saving…';
      submitBtn.disabled = true;

      const payload = {
        studentName: document.getElementById('studentName').value.trim(),
        studentId: document.getElementById('studentId').value.trim(),
        date: dateInput.value,
        status: document.getElementById('status').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'Server returned ' + response.status);
        }
        form.reset();
        dateInput.value = today();
        formStatus.textContent = 'Attendance saved.';
        loadRecords();
      } catch (error) {
        formStatus.className = 'status-line error';
        formStatus.textContent = 'Could not save attendance: ' + error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadRecords();
  </script>
</body>
</html>
